<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-6 rounded-lg shadow-lg">
    <div class="card-title justify-center text-3xl text-primary">Sign up</div>
    <div class="card-body w-full">

        <ul class="steps">
            <li class="step step-primary">Credentials</li>
            <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
        </ul>

        @if(currentStep() === 1) {
            <form [formGroup]="credentialsForm" class="flex flex-col gap-4 w-full steps">
                <app-input-form class="mt-2" label="Email" formControlName="email" />
                <app-input-form label="Display name" formControlName="displayName" />
                <app-input-form label="Password" formControlName="password" type="password" />
                <app-input-form label="Confirm password" formControlName="confirmPassword" type="password" />
                
                <div class="flex items-center justify-end gap-3">
                    <button (click)="cancel()" class="btn" type="button">Cancel</button>
                    <button
                        class="btn btn-primary"
                        type="button"
                        [disabled]="credentialsForm.invalid"
                        (click)="nextStep()">Next</button>
                </div>
            </form>
        }

        @if(currentStep() === 2) {
            <form [formGroup]="profileForm" class="flex flex-col gap-4 w-full steps">

                <app-input-form
                    class="mt-2"
                    label="Date of birth"
                    formControlName="dateOfBirth"
                    type="date"
                    [maxDate]="maxDate"
                    [minDate]="minDate" />
                <app-input-form label="Country" formControlName="country" />
                <app-input-form label="City" formControlName="city" />

                <div class="flex flex-col gap-3">
                    <div class="font-semibold">Gender:</div>
                    <div class="flex gap-4">
                        <label class="flex gap-3 items-center">
                            <span>Male</span>
                            <input type="radio" formControlName="gender" value="male" class="radio radio-primary">
                        </label>
                        <label class="flex gap-3 items-center">
                            <span>Female</span>
                            <input type="radio" formControlName="gender" value="female" class="radio radio-primary">
                        </label>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3">
                    <button (click)="prevStep()" class="btn" type="button">Back</button>
                    <button
                        class="btn btn-primary"
                        [disabled]="profileForm.invalid"
                        type="button"
                        (click)="register()">Register</button>
                </div>
            </form>
        }
    </div>

    @if(validationErrors().length > 0) {
        <div class="mt-5 flex bg-gray-200 rounded-2xl w-1/2 p-3 mx-auto">
            <ul class="flex flex-col text-error space-y-1">
                @for(error of validationErrors(); track $index) {
                    <li>{{ error }}</li>
                }
            </ul>
        </div>
    }
</div>
