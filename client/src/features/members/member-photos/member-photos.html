@if(memberService.editMode()) {
    <app-upload-image (uploadFile)="onUploadImage($event)" [loading]="uploadImageLoading()" />
}@else {
    @if(photos(); as photos) {
        @if(photos.length > 0) {
            <div class="grid grid-cols-4 auto-rows-min gap-3 p-5 h-[65vh] overflow-auto">
                @for(photo of photos; track photo.id) {
                    <div class="relative">
                        <img [src]="photo.url" alt="photo of member" class="w-full rounded-lg">
                        @if(memberService.member()?.id === accountService.currentUser()?.id) {
                            <app-delete-btn class="absolute top-1 left-1" (clickBtn)="deletePhoto(photo)" [disabled]="photo.url === memberService.member()?.imageUrl" />
                            <app-star-btn class="absolute top-1 right-1" (clickBtn)="setMainPhoto(photo)" [disabled]="photo.url === memberService.member()?.imageUrl" />
                        }
                    </div>
                }
            </div>
        }@else {
            <p class="text-gray-500">No photos available</p>
        }
    }
}
