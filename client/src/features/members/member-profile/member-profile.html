@if(memberService.member(); as member) {
    <div class="flex flex-col gap-3">
        <div class="flex gap-2">
            <span class="font-semibold">Member since:</span>
            <span>{{ member.created | date: 'longDate' }}</span>
        </div>
        <div class="flex gap-2">
            <span class="font-semibold">Last active:</span>
            <span>{{ member.lastActive | date: 'medium' }}</span>
        </div>
        <h3 class="text-lg font-semibold text-primary">About {{ member.displayName }}</h3>
        @if(memberService.editMode()) {
            <form (ngSubmit)="updateProfile()" #editForm="ngForm" class="flex flex-col w-full gap-4">
                <label class="floating-label">
                    <span>Display name</span>
                    <input
                        class="input w-full"
                        name="displayName"
                        [(ngModel)]="editableMember.displayName"
                        placeholder="Display name">
                </label>
                <label class="floating-label">
                    <span>Description</span>
                    <textarea
                        class="textarea w-full"
                        name="description"
                        [(ngModel)]="editableMember.description"
                        placeholder="Display name"></textarea>
                </label>
                <label class="floating-label">
                    <span>Country</span>
                    <input
                        class="input w-full"
                        name="country"
                        [(ngModel)]="editableMember.country"
                        placeholder="Country">
                </label>
                <label class="floating-label">
                    <span>City</span>
                    <input
                        class="input w-full"
                        name="city"
                        [(ngModel)]="editableMember.city"
                        placeholder="City">
                </label>
                <div class="flex justify-end">
                    <button
                        [disabled]="!editForm.dirty"
                        type="submit"
                        class="btn btn-success">
                        Submit
                    </button>
                </div>
            </form>
        }@else {
            <div>{{ member.description }}</div>
        }
    </div>
}
